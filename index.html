    <script>
      // Safeguard for window.fetch in iframe environments where fetch might have only a getter
      (function() {
        try {
          var _fetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          var getter = function() { return _fetch; };
          var setter = function(fn) { _fetch = fn; };
          try {
            Object.defineProperty(window, 'fetch', {
              get: getter,
              set: setter,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        } catch (_) {}
      })();
    </script>
