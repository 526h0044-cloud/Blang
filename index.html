<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // Ensures window.fetch has both getter and setter so iframe wrappers and polyfills can assign to window.fetch safely
      (function() {
        try {
          var _rawFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          var _currentFetch = typeof _rawFetch === 'function' ? _rawFetch.bind(window) : undefined;
          var getter = function() { return _currentFetch; };
          var setter = function(fn) { _currentFetch = fn; };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: getter,
                set: setter,
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getter,
              set: setter,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        } catch (_) {}
      })();

      // Protection against F12, right-click, and DevTools inspection
      (function() {
        try {
          window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
          }, true);

          window.addEventListener('keydown', function(e) {
            // F12 key
            if (e.key === 'F12' || e.keyCode === 123) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
            // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Inspect/Console/DevTools)
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
            // Ctrl+U (View Source)
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }, true);
        } catch (_) {}
      })();
    </script>
    <title>BLang Programming Language Studio</title>
    <meta name="description" content="Môi trường phát triển và biên dịch trực quan cho ngôn ngữ lập trình BLang với tài liệu giới thiệu chi tiết, REPL tương tác, và chuyển đổi mã sang Python/JavaScript." />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
